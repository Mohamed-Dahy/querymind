[project]
name = "querymind"
version = "0.1.0"
description = "AI data analyst agent: plain-language questions to safe SQL, answers, and charts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.156.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlglot>=30.23.0",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import order
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern Python syntax
    "SIM", # simplify: simpler equivalent code
    "RUF", # ruff-specific rules
]

# ---------------------------------------------------------------- mypy (type checking)
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# What plain `uv run mypy` checks: app code, tests, data and helper scripts
files = ["src", "tests", "data", "scripts", "ui", "evals"]
# Teaches mypy how pydantic models and settings are built
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import top-level folders like `evals` (querymind is installed).
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "integration: needs the Docker Postgres database (deselect with -m 'not integration')",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
