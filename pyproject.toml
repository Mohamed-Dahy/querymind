[project]
name = "querymind"
version = "0.1.0"
description = "AI data analyst agent: plain-language questions to safe SQL, answers, and charts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.156.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlglot>=30.23.0",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import order
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern Python syntax
    "SIM", # simplify: simpler equivalent code
    "RUF", # ruff-specific rules
]

# ---------------------------------------------------------------- mypy (type checking)
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# What plain `uv run mypy` checks: app code, tests, data and helper scripts
files = ["src", "tests", "data", "scripts", "ui", "evals"]
# Teaches mypy how pydantic models and settings are built
plugins = ["pydantic.mypy"]

# Ray, DeepEval and RAGAS are in the optional `eval` group (4.3, 4.5), which CI's checks job
# doesn't install. There mypy can't find them: treat them as untyped (Any) instead of failing.
# Then a `type: ignore` that their own types need here is "unused" in CI, so the modules that
# import them don't warn about unused ones.
[[tool.mypy.overrides]]
module = ["ray", "ray.*", "deepeval", "deepeval.*", "ragas", "ragas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["evals.parallel", "evals.judges"]
warn_unused_ignores = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import top-level folders like `evals` (querymind is installed),
# and data/, so tests can import the seed scripts the way they import each other (4.1).
pythonpath = [".", "data"]
# -p no:deepeval: DeepEval's pytest plugin loads wherever it is installed and hooks every
# session (telemetry, a teardown line); our tests aren't DeepEval test runs (4.5).
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-p", "no:deepeval"]
markers = [
    "integration: needs the Docker Postgres database (deselect with -m 'not integration')",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
eval = [
    "deepeval>=4.3.1",
    "langchain-community>=0.4.1,<0.4.2",
    "ragas>=0.4.3",
    "ray>=2.59.0",
]
