<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QueryMind: ask questions about your company database in plain language."
    />
    <title>QueryMind</title>
    <script>
      // Set the theme before the first paint, so a light-mode visitor never sees a dark flash.
      // Same rules as src/lib/theme.ts (readThemeChoice + resolveTheme); keep the two in sync.
      ;(function () {
        var choice = 'system'
        try {
          choice = localStorage.getItem('querymind-theme') || 'system'
        } catch (e) {}
        var light =
          choice === 'light' ||
          (choice !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      })()
    </script>
    <style>
      /* Until the app's own CSS arrives with its code: the theme's page colours (tokens.css --bg and
         --fg; keep in sync), so the first paint is never a white flash, and a line saying why it's empty. */
      html[data-theme='dark'] body {
        background: #0f172a;
        color: #f8fafc;
      }
      html[data-theme='light'] body {
        background: #f8fafc;
        color: #0f172a;
      }
      .boot {
        display: flex;
        min-height: 100dvh;
        margin: 0;
        align-items: center;
        justify-content: center;
        font:
          16px system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- React replaces this when it starts. -->
    <div id="root"><p class="boot">Loading QueryMind…</p></div>
    <noscript><p class="boot">QueryMind needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
